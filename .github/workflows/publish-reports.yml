name: Publish reports

# GitHub Pages is unavailable for this private repository on its current plan
# (the Pages API answers 422 "Your current plan does not support GitHub Pages
# for this repository"). The scorecard still needs one stable, accessible
# location, so it is published to the orphan `reports` branch:
#
#   https://github.com/HamzaNinjaCoder1/Havyn/tree/reports
#
# The branch is generated, never hand-edited. It contains only the report
# artifacts and the source commit they came from.

on:
  push:
    branches: [main]
    paths:
      - "docs/reports/scorecard.md"
      - "docs/reports/scorecard.json"
      - "docs/reports/stage3-scorecard.md"
      - "docs/reports/stage3-scorecard.json"
      - "docs/capability-map.md"
      - "docs/capability-map.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reports-branch
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Stage the generated reports
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          cp docs/reports/scorecard.md \
             docs/reports/scorecard.json \
             docs/reports/stage3-scorecard.md \
             docs/reports/stage3-scorecard.json \
             docs/capability-map.md \
             docs/capability-map.json \
             "$RUNNER_TEMP/reports/"
          {
            echo "# Havyn reports"
            echo
            echo "Generated artifacts from \`$GITHUB_SHA\` on \`$GITHUB_REF_NAME\`."
            echo
            echo "- [scorecard.md](scorecard.md)"
            echo "- [scorecard.json](scorecard.json)"
            echo "- [capability-map.md](capability-map.md)"
            echo "- [capability-map.json](capability-map.json)"
            echo "- [stage3-scorecard.md](stage3-scorecard.md)"
            echo "- [stage3-scorecard.json](stage3-scorecard.json)"
            echo
            echo "This branch is generated by \`.github/workflows/publish-reports.yml\`;"
            echo "edit the sources under \`docs/\` instead."
          } > "$RUNNER_TEMP/reports/README.md"

      - name: Replace the reports branch with this snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan reports
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP"/reports/* .
          git add README.md scorecard.md scorecard.json \
                  stage3-scorecard.md stage3-scorecard.json \
                  capability-map.md capability-map.json
          git commit -m "reports: scorecard and capability map from ${GITHUB_SHA::12}"
          git push --force origin HEAD:reports
