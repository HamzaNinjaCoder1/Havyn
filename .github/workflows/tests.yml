name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    # S2.7: a syntax error or a forbidden upstream import must fail before the
    # expensive matrix. There is no formatter/linter configured in this repo,
    # so "lint" here is what the project actually enforces: every entry point
    # byte-compiles, the source-text invariants hold, and the engine's import
    # independence is checked with the upstream package forcibly absent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Byte-compile every entry point
        run: python -m compileall -q src scripts tests build_havyn.py

      - name: Source-text invariants
        run: python -m pytest tests/autopilot/test_source_text_hygiene.py -q

  independence:
    # The engine must not import the upstream package. Running the suite with
    # a meta-path finder that raises ImportError for it proves the absence
    # rather than trusting that it "happens not to be installed".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run independence checks with the upstream package blocked
        run: >-
          python -m pytest tests/autopilot/test_engine_independence.py
          -p tests.independence_blocker -q

  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The full suite runs on the primary platform: Windows is where
        # Packet Tracer, the Script Engine, and clip.exe live. GitHub-hosted
        # Ubuntu pytest jobs in this account receive a runner shutdown signal
        # ~90 s into the suite (jobs 119773491398 / 119773491777), so they
        # cannot carry the full run; the fast Ubuntu lint/independence/wheel
        # jobs below still prove Linux packaging and imports.
        os: [windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        # Token fijo para que los tests del bridge no toquen el archivo real
        # del usuario que corre el runner.
        env:
          PT_MCP_BRIDGE_TOKEN: ci-token-long-enough-to-be-considered-valid-0123456789
        run: python -m pytest -q

  wheel:
    # S2.7: every push must also prove the project still packages — a green
    # suite on an unshippable tree is not a green build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps -w dist

      - name: Check wheel contents
        shell: python
        run: |
          import glob, zipfile
          names = sorted(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          assert any(n.startswith("network_autopilot/") for n in names), names[:5]
          print(f"wheel ok: {len(names)} members")
