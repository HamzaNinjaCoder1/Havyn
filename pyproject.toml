[build-system]
# PEP 639 (`license` como expresion SPDX + `license-files`) necesita hatchling
# >=1.27. Sin el piso, un entorno con una hatchling vieja construye una rueda
# sin licencia declarada y PyPI la rechaza al subirla, no al construirla.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "havyn"
version = "0.1.0"
description = "Havyn - closed-loop network engineering for Cisco Packet Tracer: typed topology specs, a deterministic compiler, a gated executor, honest verification and bounded repair over the Packet Tracer Script Engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "HamzaNinjaCoder1" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "cisco",
    "packet-tracer",
    "networking",
    "network-automation",
    "topology",
    "ccna",
    "ospf",
    "vlan",
    "network-verification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    # mcp >=1.13 builds tool output schemas from return annotations, which requires
    # pydantic >=2.11. Pinning pydantic too low (e.g. 2.8) makes the server crash on
    # startup at the first @mcp.tool() with a PydanticUserError. Keep both in sync.
    "mcp[cli]>=1.13,<2",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/HamzaNinjaCoder1/Havyn"
Repository = "https://github.com/HamzaNinjaCoder1/Havyn"
Issues = "https://github.com/HamzaNinjaCoder1/Havyn/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import `src.network_autopilot`. Pinning both entries here removes the
# dependence on pytest's implicit rootdir insertion and guarantees a single
# module identity. A few tests read files relative to the repo root, so the
# suite has to be run from the root.
pythonpath = [".", "src"]

[project.scripts]
havyn = "network_autopilot.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/network_autopilot"]

[tool.hatch.build.targets.sdist]
# El sdist por defecto se lleva TODO lo que no esté en .gitignore: los GIFs y
# PNGs de `demo/` son 9.7 de los 10.2 MB del tarball, para un paquete cuyo
# código pesa 219 KB. Nadie que haga `pip install` necesita el banner.
exclude = [
    "demo/",
    "docs/",
    "data/",
    "mkdocs.yml",
    ".github/",
]
