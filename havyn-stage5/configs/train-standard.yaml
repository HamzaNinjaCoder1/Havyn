# S5.17 Standard model (Qwen3-8B) LoRA fine-tuning config.
# Consumed by train_lora.py on Colab. Checkpoints go to Drive; training must
# be resumable after a runtime disconnect (--resume).

base_model: Qwen/Qwen3-8B
role: standard
load_in_4bit: true
# Planning reserve for the quantised base weights; VRAM fallback subtracts it.
model_weight_gb: 5.0
max_seq_length: 4096

lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  use_gradient_checkpointing: true

train:
  dataset: havyn-train-v1        # frozen dataset directory (S5.16)
  dataset_dir: /content/drive/MyDrive/havyn-stage5/datasets/havyn-train-v1
  task_tags:                     # the frozen dataset's task names
    - intent
    - prompt
    - diagnosis
    - enhancement
    - clarification
  epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  bf16: true
  seed: 20261028
  save_steps: 250
  save_total_limit: 3            # resume support: never keep only the last

output:
  checkpoint_dir: /content/drive/MyDrive/havyn-stage5/checkpoints/standard
  report_dir: /content/drive/MyDrive/havyn-stage5/reports/training-standard
